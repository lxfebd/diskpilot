[workspace]
resolver = "2"
members = [
  "crates/scanner",
  "crates/scaffold",
  "crates/executor",
  "crates/scaffold-lint",
  "crates/steam-inspector",
  "crates/toolbelt",
  "crates/agent-server",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition    = "2021"
license    = "MIT"
repository = "https://github.com/lxfebd/diskpilot"
version    = "0.1.2"

[workspace.dependencies]
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1.1"
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir            = "2.5"
jwalk              = "0.8"
rayon              = "1.10"
ntfs               = "0.4"
windows-sys        = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_WindowsConnectionManager"] }
globset            = "0.4"
trash              = "5"
# 0.13 与 rmcp 1.8 的 transport-streamable-http-client-reqwest 对齐（0.12 不实现 StreamableHttpClient）
reqwest            = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form"] }
tokio              = { version = "1", features = ["full"] }
once_cell          = "1"
chrono             = { version = "0.4", features = ["serde"] }
sha2               = "0.11"
dirs               = "5"
shellexpand        = "3"
tempfile           = "3"
include_dir        = "0.7"
png                = "0.17"
zip                = { version = "2", default-features = false, features = ["deflate"] }

# MCP（Model Context Protocol）官方 Rust SDK —— agent-server（AI 可操作工具集）
# server+schemars+transport-io = agent-server（被 spawn 的一侧）
# client+transport-child-process = 桌面后端（spawn agent-server 并对话的一侧）
# transport-streamable-http-client-reqwest = 桌面后端连远程 MCP 服务器（streamable HTTP，reqwest 客户端）
# 1.4.0 起修复 RUSTSEC-2026-0189（Streamable HTTP DNS rebinding，CVSS 9.3）
rmcp     = { version = "1.4", features = ["server", "client", "schemars", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars = "1"
# PowerShell 输出在中文系统是 GBK，ps_capture 需此兜底解码
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true

# 开发体积优化：依赖不生成完整 PDB（省 2GB+），自身保留行号表便于 panic 定位
# 调试时如需完整断点符号，可临时 cargo clean -p <crate> 或本 profile 改回 debug=2
[profile.dev]
debug = "line-tables-only"      # 自身：保留行号表（panic 定位够用，体积小）
incremental = true

[profile.dev.package."*"]
debug = false                   # 所有依赖：不生成 PDB，增量编译更快、体积小一个数量级
