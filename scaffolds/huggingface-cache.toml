id          = "huggingface-cache"
name        = "HuggingFace 模型缓存"
homepage    = "https://huggingface.co/docs/hub/models-cache"
risk        = "low"
disclaimer  = """\
清理 HuggingFace Hub 的下载缓存：模型（models）、数据集（datasets）与
空间（spaces）的缓存文件。这些文件是 huggingface_hub 下载时自动写入的，
删除后下次使用同一模型/数据集时会自动重新下载，不影响已下载内容之外的
任何东西。\
绝不触碰：~/.cache 之外的用户文件、项目源码、虚拟环境、正在使用的模型
权重（若你依赖离线加载模型，请先确认缓存不在清理范围）。\
注意：清理走系统回收站，可还原。"""

detect = [
  "%USERPROFILE%/.cache/huggingface",
  "${HOME}/.cache/huggingface",
  "${HF_HOME}/hub",
  "${HF_HUB_CACHE}",
]

[match]
name_contains    = ["huggingface"]
must_have_child  = []

# 严格锚定 HuggingFace 自己的缓存目录：~/.cache/huggingface（hub 模型 /
# datasets / spaces 缓存根）。绝不使用裸 `**/huggingface/` 前缀，防止误命中
# 用户文档里手动创建的同名目录。

[[scope]]
id                  = "hf-hub-models"
label               = "HuggingFace 模型缓存（hub）"
glob                = "{%USERPROFILE%,${HOME}}/.cache/huggingface/hub/**"
mode                = "recycle"
category            = "cache"
prompt              = { kind = "none" }
recycle_granularity = "directory"

[[scope]]
id                  = "hf-datasets-cache"
label               = "HuggingFace 数据集缓存"
glob                = "{%USERPROFILE%,${HOME}}/.cache/huggingface/datasets/**"
mode                = "recycle"
category            = "cache"
prompt              = { kind = "none" }
recycle_granularity = "directory"

[[scope]]
id                  = "hf-spaces-cache"
label               = "HuggingFace Spaces 缓存"
glob                = "{%USERPROFILE%,${HOME}}/.cache/huggingface/spaces/**"
mode                = "recycle"
category            = "cache"
prompt              = { kind = "none" }
recycle_granularity = "directory"
