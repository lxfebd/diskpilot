name: Release

# 三平台预编译：Windows（exe/MSI）、macOS（dmg/app，x64 + arm64）、Linux（AppImage/deb/rpm）。
# 说明：
# - 代码层跨平台已就绪（所有 Windows-only 助手都 cfg-gated + 非 Windows 兜底，
#   agent-server 二进制定位按平台取 `agent-server` / `agent-server.exe`）。
# - macOS 侧：CI 只出**未签名** dmg/app（`APPLE_*` 签名证书未配置时自动跳过签名）。
#   要正式分发带签名的 macOS 版，需在 repo secrets 配 APPLE_CERTIFICATE /
#   APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD
#   / APPLE_TEAM_ID（tauri-action 自动识别）。
# - Windows 侧维持现状（NSIS + 不签名 MSI 模板缺失时只用 NSIS）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Linux 打包需要 webkit2gtk/gtk 系统库（tauri-action 官方清单）
      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile=false

      # macOS 签名/公证（可选）：仅当证书 secret 已配置时才注入。
      # 2026-09-21 踩坑：直接在 tauri-action env 里写
      # `APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}`，未配置时是空字符串，
      # 会被 tauri-action 当成"有证书"去 `security import`，
      # 报 `failed to import keychain certificate`、构建中止。
      #
      # 这里不依赖 `if:` 解析 secrets（step 级可用但语义微妙），
      # 改用 shell 显式判断：只有非空值才写入 GITHUB_ENV。
      - name: Inject macOS signing env (only when configured)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
            fi
          done

      # R544 踩坑：tauri bundler 打包时要从 github 下载 NSIS/WiX/AppRun 二进制，
      # 上游 release-assets 偶发 504 会让整个 release 挂掉（mac .app 不受影响）。
      # 这里先用 curl 重试下载，放进 bundler 的工具缓存目录（cache_dir/tauri），
      # bundler 发现必需文件已存在（NSIS 侧还会再验 sha1）就跳过下载。
      # R549 审查 H1/M1：所有下载物 pin sha256（上游对 linux 三件套只查存在性、
      # 不验哈希，且会被 bundler 执行——可变引用一旦被重指将无校验流入已签名产物）；
      # 下载走 .part + 原子 mv，中断不会在缓存路径留下半截文件被存在性检查误用；
      # gtk 插件脚本改用不可变 commit SHA（原 master 分支是可变引用）。
      - name: Pre-download tauri bundler tools (NSIS/WiX/AppRun/linuxdeploy) with retry + sha256
        if: startsWith(matrix.os, 'windows') || startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -e
          dl() { # url out sha256
            local url="$1" out="$2" want="$3" i got
            for i in 1 2 3 4 5 6 7 8; do
              rm -f "$out.part"
              if curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
                   --proto '=https' --proto-redir '=https' -o "$out.part" "$url"; then
                # R554b：哈希提取按平台分流——windows leg 走 PowerShell Get-FileHash
                # （MSYS git-bash 的 sha256sum 输出在管道里形态不可靠，两次实测误判 mismatch）
                if [[ "${{ matrix.os }}" == windows-* ]]; then
                  got="$(PS_OUT="$out.part" powershell -NoProfile -Command '[Console]::Out.Write((Get-FileHash $env:PS_OUT -Algorithm SHA256).Hash.ToLower())')"
                else
                  got="$(sha256sum "$out.part" | head -c 64 | tr -d '[:space:]')"
                fi
                if [ "$got" != "$want" ]; then
                  echo "sha256 mismatch for $url: got $got want $want" >&2
                  rm -f "$out.part"; return 1
                fi
                mv "$out.part" "$out"
                return 0
              fi
              echo "download retry $i: $url" >&2; sleep $((i * 10))
            done
            echo "FAILED to download $url" >&2; rm -f "$out.part"; return 1
          }
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            tools="$LOCALAPPDATA/tauri"
            mkdir -p "$tools"
            # NSIS 3.13：zip 内含 nsis-3.13/ 目录，整体挪到 NSIS（先清残留防嵌套）
            if [ ! -f "$tools/NSIS/makensis.exe" ]; then
              dl "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip" \
                 "$RUNNER_TEMP/nsis.zip" "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8"
              rm -rf "$tools/NSIS"
              unzip -q "$RUNNER_TEMP/nsis.zip" -d "$RUNNER_TEMP/nsisx"
              mv "$RUNNER_TEMP/nsisx/nsis-3.13" "$tools/NSIS"
            fi
            # tauri 自带的 nsis 插件 dll（bundler 校验其 sha1，版本必须对）
            mkdir -p "$tools/NSIS/Plugins/x86-unicode/additional"
            dl "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" \
               "$tools/NSIS/Plugins/x86-unicode/additional/nsis_tauri_utils.dll" \
               "5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709"
            # WiX 3.14（MSI 用）
            if [ ! -f "$tools/WixTools314/candle.exe" ]; then
              dl "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" \
                 "$RUNNER_TEMP/wix.zip" "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"
              unzip -q "$RUNNER_TEMP/wix.zip" -d "$tools/WixTools314"
            fi
          elif [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            tools="$HOME/.cache/tauri"
            mkdir -p "$tools"
            # AppImage 三件套（bundler 下载后要求可执行位；文件已存在即跳过）。
            # R549：AppRun 走 AppImageKit continuous 移动 tag，只能靠 pin 的 sha256 防重指
            if [ ! -f "$tools/AppRun-x86_64" ]; then
              dl "https://github.com/AppImage/AppImageKit/releases/download/continuous/AppRun-x86_64" \
                 "$tools/AppRun-x86_64" "f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f"
              chmod +x "$tools/AppRun-x86_64"
            fi
            if [ ! -f "$tools/linuxdeploy-x86_64.AppImage" ]; then
              dl "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage" \
                 "$tools/linuxdeploy-x86_64.AppImage" "36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62"
              chmod +x "$tools/linuxdeploy-x86_64.AppImage"
            fi
            # R549：gtk 插件脚本固定到 commit dda522b（原 master 可变）
            if [ ! -f "$tools/linuxdeploy-plugin-gtk.sh" ]; then
              dl "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/dda522bce37387f1b853d9095713bfaa924c8423/linuxdeploy-plugin-gtk.sh" \
                 "$tools/linuxdeploy-plugin-gtk.sh" "7804c9eef13e59bf2783aad9882ef9db8f3f3f9e8d631874b1d348d550a3693f"
              chmod +x "$tools/linuxdeploy-plugin-gtk.sh"
            fi
          fi
          echo "bundler tools ready under cache dir"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥：updater 只认持此私钥签名的安装包。私钥由
          # `tauri signer generate` 生成，公钥已写进 tauri.conf.json
          # plugins.updater.pubkey；私钥必须作为 Actions Secret 配置，
          # 名为 TAURI_SIGNING_PRIVATE_KEY（无密码时 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # 可留空）。丢失私钥 = 已装用户再也无法更新，务必离线备份。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # beforeBuildCommand 里的 prepare-sidecar.mjs 读它：agent-server 必须
          # 和应用编到同一个 target triple，否则 macOS arm64 runner 打 x86_64 包
          # 会塞进错架构的 sidecar（cargo 默认只按 host 出包）。
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "DiskPilot ${{ github.ref_name }}"
          releaseDraft: true
          # updater 走 GitHub Release latest.json；Windows 同时出 NSIS/MSI 时
          # 优先 NSIS（setup.exe），与用户下载习惯一致。
          updaterJsonPreferNsis: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # 校验和：产物直接传进同一个 draft release，文件名按 target 分开，
      # 避免矩阵四个 job 互相覆盖同一份 SHA256SUMS。
      - name: Publish checksums
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 产物目录取决于 cargo target dir（workspace 根 vs src-tauri），
          # 这里按 `*/release/bundle` 找，不硬编码前缀。
          bundles=$(find . -type d -path "*/${{ matrix.target }}/release/bundle" 2>/dev/null || true)
          if [ -z "$bundles" ]; then echo "找不到 bundle 目录，无法出校验和"; exit 1; fi
          sums="SHA256SUMS-${{ matrix.target }}.txt"
          : > "$sums"
          # shellcheck disable=SC2086
          find $bundles -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' \) -print0 \
            | while IFS= read -r -d '' f; do
                (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
              done >> "$sums"
          if [ ! -s "$sums" ]; then echo "bundle 里没有任何安装包，拒绝出空校验和文件"; exit 1; fi
          cat "$sums"
          gh release upload "${GITHUB_REF_NAME}" "$sums" --clobber
