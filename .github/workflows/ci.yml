name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# DiskPilot ships Windows-first, but the workspace is portable: every
# Windows-only helper (registry reads, NTFS MFT, system proxy parsing,
# $Recycle.Bin pruning) is cfg-gated with a non-Windows fallback, so the
# same crate set compiles on macOS/Linux. CI runs lint + test on all three
# OSes to keep it that way; frontend is OS-independent (once, on ubuntu).

jobs:
  lint-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # desktop 的 build.rs 校验 sidecar binaries/agent-server-<triple> 必须存在
      # （tauri externalBin）。workspace 各 crate 零横向依赖，cargo clippy/test
      # 的编译顺序不保证 agent-server 先就位，故显式先编一次（build.rs 兜底复制）。
      - run: cargo build -p agent-server
      - run: cargo fmt --all -- --check
      # R335 起加回 `-D warnings`：R1–R9 累积的 ~42 处存量 clippy 噪音已清完，
      # 本地 `pnpm check:rust` 跑同一条命令（fmt + clippy -D warnings），
      # 连同 agent-server 的 3 处 doc-list 缩进——worktree 现在 0 警告。
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Cargo Audit：扫描依赖树已知漏洞（RustSec Advisory DB），有漏洞即红。
  # 不缓存的临时 job：cargo-audit 自己拉 Cargo.lock 附近的 advisory 数据库，
  # 放 ubuntu-latest 与其余 Rust job 一致，避免平台相关依赖漏检。
  audit-rust:
    runs-on: ubuntu-latest
    # rustsec/audit-check 要把审计结果上报成 GitHub check-run：push 事件下
    # GITHUB_TOKEN 默认 read-only，须显式授予 checks: write，否则
    # 「Resource not accessible by integration」红（审计本身通过）。
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        # 默认忽略 GHSA（GitHub 自带告警）与 dev 依赖噪音；
        # 只对 reachable 依赖报错，避免整树误报阻塞提交。

  # 三平台测试。macOS/Linux 上 `cargo test --workspace` 会编译 desktop lib：
  # tauri 依赖需要系统库，故 Linux 先装 webkit2gtk（Ubuntu 官方源）。
  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 同 lint-rust：sidecar 先编，desktop build.rs 校验才能过
      - run: cargo build -p agent-server
      - run: cargo test --workspace --no-fail-fast

  # R513: 无头 self-test 三平台冒烟——`--self-test` 不建窗口，验证扫描核心 /
  # Ed25519 签名验签+篡改拒绝 / nonce 一次性+频率限制+write_gate 后 exit 0。
  # 清掉 security-model 里「桌面运行时未在 CI 自动化验证」的已知边界。
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # desktop 的 build.rs 校验 sidecar binaries/agent-server-<triple> 必须存在
      - run: cargo build -p agent-server
      - run: cargo run -p diskpilot-desktop -- --self-test

  # Windows-only：scaffold-lint 走 bash glob，只有 shell 会展开
  # scaffolds/*.toml（cmd/PowerShell 会把字面模式原样传给程序）。
  scaffold-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: cargo run -p diskpilot-scaffold-lint -- scaffolds/*.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check = tsc -b + eslint + vitest（含版本单源守卫 / 样式 token 守卫），
      # 一条命令覆盖全部前端门禁；build 再跑一次 vite build 验证产物可出。
      - run: pnpm -C apps/desktop check
      - run: pnpm -C apps/desktop build
      # 文档是全仓资产：README / docs / .github 里的相对链接必须指向真实文件，
      # CHANGELOG 结构也在同一道检查里（R392 起）。本地用 `pnpm check:docs` 跑同一道检查。
      - run: pnpm check:docs
