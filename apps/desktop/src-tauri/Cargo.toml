[package]
name        = "diskpilot-desktop"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true

[lib]
name       = "diskpilot_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "diskpilot"
path = "src/main.rs"

[features]
# 生产构建模式：把前端 dist 内嵌进 exe（否则会去连 devUrl）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2", features = [] }
tauri-plugin-dialog  = "2"
tauri-plugin-fs      = "2"
tauri-plugin-shell   = "2"

serde.workspace              = true
serde_json.workspace         = true
tokio.workspace              = true
anyhow.workspace             = true
chrono.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true
globset.workspace            = true
reqwest.workspace            = true
url                          = "2"
include_dir.workspace        = true
dirs.workspace               = true
toml.workspace               = true
rmcp.workspace               = true

diskpilot-scanner          = { path = "../../../crates/scanner" }
diskpilot-scaffold         = { path = "../../../crates/scaffold" }
diskpilot-executor         = { path = "../../../crates/executor" }
diskpilot-steam-inspector  = { path = "../../../crates/steam-inspector" }
diskpilot-toolbelt         = { path = "../../../crates/toolbelt" }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace    = true
# powercfg / CIM 等控制台输出在中文系统上是 GBK，UTF-8 解码失败时兜底
encoding_rs              = "0.8"

[dev-dependencies]
tempfile.workspace = true
