[package]
name        = "diskpilot-scaffold-lint"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "清理脚本静态校验器（CI 门禁）：schema、scope glob 非空、红线匹配、recycle_granularity 陷阱"

[[bin]]
name = "diskpilot-scaffold-lint"
path = "src/main.rs"

[dependencies]
diskpilot-scaffold = { path = "../scaffold" }
# R498：sign 子命令给 TOML 做 Ed25519 签名（上架社区索引用），与安装端验签同一实现
diskpilot-toolbelt = { path = "../toolbelt" }
globset.workspace = true
toml.workspace    = true
anyhow.workspace  = true
